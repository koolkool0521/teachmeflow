<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현장 전기공사 체크리스트</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Header -->
  <header class="sticky top-0 bg-white/95 backdrop-blur border-b border-slate-200 z-30 px-4 py-3.5 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <span class="text-xs font-semibold text-blue-600 tracking-wider uppercase">현장 관리 모바일 웹</span>
        <h1 class="text-lg font-bold text-slate-900 mt-0.5">전기공사 체크리스트</h1>
      </div>
      <button onclick="resetAll()" class="p-2 text-xs font-medium text-slate-500 hover:text-red-600 active:bg-slate-100 rounded-lg transition-colors flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
        </svg>
        초기화
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

    <!-- Progress Dashboard Card -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-md relative overflow-hidden">
      <div class="absolute right-0 bottom-0 opacity-10 translate-x-4 translate-y-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      
      <div class="relative z-10">
        <div class="flex justify-between items-baseline">
          <span class="text-sm font-medium text-slate-300">전체 공정 진행률</span>
          <span id="progress-percent" class="text-3xl font-extrabold tracking-tight">0%</span>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-700 h-2.5 rounded-full mt-3 overflow-hidden">
          <div id="progress-bar" class="bg-blue-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-700/50 text-xs text-slate-300">
          <div>완료 항목: <span id="completed-count" class="font-bold text-white">0</span> / <span id="total-count" class="font-bold text-white">0</span>개</div>
          <button onclick="shareStatus()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1.5 rounded-lg active:scale-95 transition-transform flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
            현황 복사
          </button>
        </div>
      </div>
    </div>

    <!-- Quick Category Filter Tab/Chips (Horizontal Scroll) -->
    <div class="space-y-2">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">공간별 바로가기</span>
      <div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4 scrollbar-none" id="category-chips">
        <!-- Generated Dynamically -->
      </div>
    </div>

    <!-- Filter Toggle (All, Pending, Completed) -->
    <div class="flex bg-slate-200/60 p-1 rounded-xl text-xs font-semibold">
      <button onclick="setFilter('all')" id="btn-filter-all" class="flex-1 py-2 text-center rounded-lg transition-all text-slate-700 bg-white shadow-sm">전체보기</button>
      <button onclick="setFilter('pending')" id="btn-filter-pending" class="flex-1 py-2 text-center rounded-lg transition-all text-slate-500 hover:text-slate-800">진행중</button>
      <button onclick="setFilter('completed')" id="btn-filter-completed" class="flex-1 py-2 text-center rounded-lg transition-all text-slate-500 hover:text-slate-800">완료됨</button>
    </div>

    <!-- Checklist Sections -->
    <div id="checklist-container" class="space-y-6">
      <!-- Generated Dynamically -->
    </div>

  </main>

  <!-- Bottom Notice Bar (Floating Status) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-4 z-20 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center text-xs text-slate-500">
      <div class="flex items-center gap-1.5">
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>실시간 현장 저장 활성화됨</span>
      </div>
      <span id="last-update" class="text-[10px]">최종 변경: 방금 전</span>
    </div>
  </div>

  <script>
    // User Provided Data - Strictly Unaltered
    const rawData = {
      "공통사항": [
        "2인치, 3인치 타공(파란색 3인치, 노란색 2인치)",
        "맹커버들 없애버릴 수 있는지",
        "천장 환풍기 커버 제거, 누런 센서들 교체 가능한지?",
        "시스템에어컨 케이스 탈거(청소용)"
      ],
      "거실": [
        "실링팬 전기",
        "다운라이트 타공",
        "전등스위치 회로 추가(소파, 중앙, 커튼박스+책장)",
        "커튼박스에 콘센트 추가",
        "필요없는 콘센트커버 제거 및 교체"
      ],
      "안방": [
        "커튼박스 간접등, 다운라이트 타공",
        "커튼박스 뒤쪽 콘센트",
        "스위치 (다운라이트, 간접등 분리)",
        "스위치 교체",
        "드레스룸 스위치 교체"
      ],
      "서재": [
        "다운라이트 타공, 전등 교체",
        "스위치 분리(2인치+간접등, 5인치)",
        "커튼박스 간접등",
        "스위치 교체",
        "전등 제거"
      ],
      "작은방": [
        "3인치 다운라이트",
        "스위치 교체",
        "전등 제거"
      ],
      "현관": [
        "다운라이트, 간접등 하나로 묶기(센서)"
      ],
      "복도": [
        "다운라이트 교체"
      ],
      "주방": [
        "인덕션 전용 회로 추가"
      ]
    };

    // State
    let itemsState = {};
    let currentFilter = 'all'; // 'all', 'pending', 'completed'
    let selectedCategory = '전체'; // '전체' or specific category name

    // Key for Local Storage
    const STORAGE_KEY = 'field_electric_checklist_v1';

    // Initialize State
    function initState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        itemsState = JSON.parse(saved);
        // Sync any new keys if rawData changed
        verifyStateSync();
      } else {
        resetStateToDefault();
      }
    }

    function verifyStateSync() {
      let updated = false;
      Object.keys(rawData).forEach(cat => {
        rawData[cat].forEach((text, index) => {
          const id = `${cat}_${index}`;
          if (!itemsState[id]) {
            itemsState[id] = { checked: false, note: '' };
            updated = true;
          }
        });
      });
      if (updated) saveState();
    }

    function resetStateToDefault() {
      itemsState = {};
      Object.keys(rawData).forEach(cat => {
        rawData[cat].forEach((text, index) => {
          const id = `${cat}_${index}`;
          itemsState[id] = { checked: false, note: '' };
        });
      });
      saveState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(itemsState));
      updateProgress();
      document.getElementById('last-update').innerText = `최종 변경: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }

    function resetAll() {
      if (confirm('모든 체크 상태와 메모를 초기화하시겠습니까?')) {
        resetStateToDefault();
        renderCategoryChips();
        renderChecklist();
      }
    }

    // Toggle Item Checked State
    function toggleItem(id) {
      itemsState[id].checked = !itemsState[id].checked;
      saveState();
      
      // Update UI elements gracefully without full re-render for better UX
      const card = document.getElementById(`card-${id}`);
      const checkbox = document.getElementById(`check-${id}`);
      const iconCheck = document.getElementById(`icon-check-${id}`);
      const textSpan = document.getElementById(`text-${id}`);

      if (itemsState[id].checked) {
        card.classList.remove('bg-white', 'border-slate-200');
        card.classList.add('bg-slate-100/80', 'border-slate-300');
        checkbox.classList.add('bg-blue-600', 'border-blue-600');
        iconCheck.classList.remove('hidden');
        textSpan.classList.add('line-through', 'text-slate-400');
      } else {
        card.classList.add('bg-white', 'border-slate-200');
        card.classList.remove('bg-slate-100/80', 'border-slate-300');
        checkbox.classList.remove('bg-blue-600', 'border-blue-600');
        iconCheck.classList.add('hidden');
        textSpan.classList.remove('line-through', 'text-slate-400');
      }

      // If viewing filtered list, full render to hide items
      if (currentFilter !== 'all') {
        renderChecklist();
      }
      renderCategoryChips(); // Update chip counts
    }

    // Toggle Memo Textarea Visibility
    function toggleNoteField(id) {
      const field = document.getElementById(`note-container-${id}`);
      field.classList.toggle('hidden');
    }

    // Save Memo Text
    function saveNote(id, text) {
      itemsState[id].note = text;
      saveState();
    }

    // Calculate & Display Progress
    function updateProgress() {
      let total = 0;
      let completed = 0;

      Object.keys(itemsState).forEach(id => {
        total++;
        if (itemsState[id].checked) completed++;
      });

      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('completed-count').innerText = completed;
      document.getElementById('total-count').innerText = total;
    }

    // Set Filters
    function setFilter(filter) {
      currentFilter = filter;
      
      // Update Filter Tabs UI
      const filters = ['all', 'pending', 'completed'];
      filters.forEach(f => {
        const btn = document.getElementById(`btn-filter-${f}`);
        if (f === filter) {
          btn.className = "flex-1 py-2 text-center rounded-lg transition-all text-slate-800 bg-white shadow-sm";
        } else {
          btn.className = "flex-1 py-2 text-center rounded-lg transition-all text-slate-500 hover:text-slate-800";
        }
      });

      renderChecklist();
    }

    function setCategoryFilter(category) {
      selectedCategory = category;
      renderCategoryChips();
      renderChecklist();
    }

    // Render Filters Chips
    function renderCategoryChips() {
      const container = document.getElementById('category-chips');
      container.innerHTML = '';

      // "전체" Chip
      let totalAll = 0;
      let completedAll = 0;
      Object.keys(itemsState).forEach(id => {
        totalAll++;
        if (itemsState[id].checked) completedAll++;
      });

      const allActive = selectedCategory === '전체';
      const allChip = document.createElement('button');
      allChip.className = `flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold border transition-all ${allActive ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200'}`;
      allChip.innerHTML = `전체 <span class="ml-1 opacity-70">${completedAll}/${totalAll}</span>`;
      allChip.onclick = () => setCategoryFilter('전체');
      container.appendChild(allChip);

      // Category Chips
      Object.keys(rawData).forEach(cat => {
        let totalCat = 0;
        let completedCat = 0;
        rawData[cat].forEach((_, index) => {
          totalCat++;
          if (itemsState[`${cat}_${index}`].checked) completedCat++;
        });

        const active = selectedCategory === cat;
        const chip = document.createElement('button');
        chip.className = `flex-shrink-0 px-4 py-2 rounded-full text-xs font-semibold border transition-all ${active ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200'}`;
        chip.innerHTML = `${cat} <span class="ml-1 opacity-70">${completedCat}/${totalCat}</span>`;
        chip.onclick = () => setCategoryFilter(cat);
        container.appendChild(chip);
      });
    }

    // Render Main Checklist
    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';

      const targetCategories = selectedCategory === '전체' ? Object.keys(rawData) : [selectedCategory];
      let visibleItemCount = 0;

      targetCategories.forEach(categoryName => {
        const items = rawData[categoryName];
        
        // Filter items within the category
        const filteredItems = items.map((text, index) => ({
          id: `${categoryName}_${index}`,
          text: text,
          state: itemsState[`${categoryName}_${index}`]
        })).filter(item => {
          if (currentFilter === 'pending') return !item.state.checked;
          if (currentFilter === 'completed') return item.state.checked;
          return true;
        });

        if (filteredItems.length === 0) return; // Hide category if empty under current filters

        visibleItemCount += filteredItems.length;

        // Category Box
        const section = document.createElement('section');
        section.className = "bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm space-y-3";

        // Header
        const header = document.createElement('div');
        header.className = "flex items-center justify-between pb-2 border-b border-slate-100";
        header.innerHTML = `
          <h2 class="font-bold text-slate-900 flex items-center gap-2">
            <span class="w-1.5 h-4 bg-blue-600 rounded-full"></span>
            ${categoryName}
          </h2>
          <span class="text-xs text-slate-400 font-semibold">${filteredItems.length}개 항목</span>
        `;
        section.appendChild(header);

        // List container
        const listContainer = document.createElement('div');
        listContainer.className = "space-y-2.5";

        filteredItems.forEach(item => {
          const itemCard = document.createElement('div');
          itemCard.id = `card-${item.id}`;
          
          const isChecked = item.state.checked;
          itemCard.className = `border rounded-xl p-3.5 transition-all ${
            isChecked ? 'bg-slate-100/80 border-slate-300' : 'bg-white border-slate-200'
          }`;

          itemCard.innerHTML = `
            <div class="flex items-start gap-3">
              <!-- Custom Checkbox (Touch Target 44px min inside flex) -->
              <div onclick="toggleItem('${item.id}')" class="flex-shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center cursor-pointer transition-colors ${
                isChecked ? 'bg-blue-600 border-blue-600' : 'border-slate-300'
              }" id="check-${item.id}">
                <svg id="icon-check-${item.id}" class="h-4 w-4 text-white ${isChecked ? '' : 'hidden'}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </div>

              <!-- Text Area -->
              <div class="flex-1 min-w-0">
                <span onclick="toggleItem('${item.id}')" id="text-${item.id}" class="text-sm font-semibold leading-relaxed break-keep cursor-pointer select-none ${
                  isChecked ? 'line-through text-slate-400' : 'text-slate-700'
                }">
                  ${item.text}
                </span>
                
                <!-- Interaction buttons -->
                <div class="flex gap-4 mt-2 text-xs font-semibold text-slate-400">
                  <button onclick="toggleNoteField('${item.id}')" class="flex items-center gap-1.5 hover:text-slate-600 active:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    <span>현장 메모</span>
                  </button>
                </div>

                <!-- Note Input Container -->
                <div id="note-container-${item.id}" class="mt-2.5 ${item.state.note ? '' : 'hidden'}">
                  <textarea 
                    oninput="saveNote('${item.id}', this.value)"
                    placeholder="현장 특이사항이나 협의 내용을 적으세요..."
                    class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-slate-400 transition-colors placeholder:text-slate-300 resize-none"
                    rows="2"
                  >${item.state.note || ''}</textarea>
                </div>
              </div>
            </div>
          `;
          listContainer.appendChild(itemCard);
        });

        section.appendChild(listContainer);
        container.appendChild(section);
      });

      // Empty State
      if (visibleItemCount === 0) {
        const emptyBox = document.createElement('div');
        emptyBox.className = "text-center py-12 bg-white border border-slate-200 rounded-2xl shadow-sm";
        emptyBox.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-slate-300 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <p class="text-sm font-semibold text-slate-500">필터에 해당하는 작업 항목이 없습니다.</p>
        `;
        container.appendChild(emptyBox);
      }
    }

    // Share/Export Status Text to Clipboard (Kakao/Text format)
    function shareStatus() {
      let shareText = `🚧 [현장 전기공사 체크 현황] 🚧\n\n`;
      let total = 0;
      let completed = 0;

      Object.keys(rawData).forEach(cat => {
        let catText = `📍 ${cat}\n`;
        let hasItem = false;
        
        rawData[cat].forEach((text, index) => {
          total++;
          const item = itemsState[`${cat}_${index}`];
          const emoji = item.checked ? '✅' : '⬜';
          if (item.checked) completed++;
          
          catText += `${emoji} ${text}\n`;
          if (item.note) {
            catText += `   📝 메모: ${item.note}\n`;
          }
          hasItem = true;
        });
        
        if (hasItem) {
          shareText += catText + '\n';
        }
      });

      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      shareText = `📊 공정률: ${percent}% (${completed}/${total} 완료)\n\n` + shareText;

      // Copy using legacy compatibility logic for iframe sandbox constraints
      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = shareText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempTextArea);

      // Display Alert modal alternative (Toast notification)
      showToast('체크 현황과 메모가 클립보드에 복사되었습니다! 카카오톡이나 문자 메시지에 붙여넣어 공유하세요.');
    }

    // Simple Custom Toast Notification
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = "fixed top-5 left-4 right-4 md:left-auto md:w-96 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl z-50 transition-all duration-300 opacity-0 transform translate-y-[-20px] leading-relaxed break-keep";
      toast.innerText = message;
      document.body.appendChild(toast);
      
      // Animate In
      setTimeout(() => {
        toast.classList.remove('opacity-0', 'translate-y-[-20px]');
      }, 50);

      // Animate Out & Remove
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-20px]');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // App Startup
    window.onload = function() {
      initState();
      renderCategoryChips();
      renderChecklist();
    }
  </script>
</body>
</html>
